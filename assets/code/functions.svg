<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">NYX recursive function code</title><desc id="d">Syntax highlighted factorial and normalization functions.</desc><rect width="1200" height="390" rx="16" fill="#071426" stroke="#168BFF" stroke-width="2"/><rect width="1200" height="54" rx="16" fill="#0D2038"/><text x="34" y="36" fill="#9BB8CC" font-family="Arial" font-size="18">functions.nyx · RECURSION</text><g font-family="Consolas,monospace" font-size="25"><text x="60" y="105" fill="#00D9FF">fn</text><text x="105" y="105" fill="#F2FAFF">factorial</text><text x="235" y="105" fill="#9BB8CC">(n) {</text><text x="100" y="150" fill="#00D9FF">if</text><text x="140" y="150" fill="#9BB8CC">(</text><text x="158" y="150" fill="#F2FAFF">n</text><text x="180" y="150" fill="#9BB8CC">&lt;=</text><text x="215" y="150" fill="#FFCF70">1</text><text x="235" y="150" fill="#9BB8CC">) {</text><text x="140" y="195" fill="#00D9FF">return</text><text x="235" y="195" fill="#FFCF70">1</text><text x="100" y="240" fill="#9BB8CC">}</text><text x="100" y="285" fill="#00D9FF">return</text><text x="195" y="285" fill="#F2FAFF">n</text><text x="218" y="285" fill="#9BB8CC">*</text><text x="245" y="285" fill="#60E6FF">factorial</text><text x="365" y="285" fill="#9BB8CC">(n - 1)</text><text x="60" y="330" fill="#9BB8CC">}</text><text x="540" y="105" fill="#00D9FF">fn</text><text x="585" y="105" fill="#F2FAFF">normalize</text><text x="720" y="105" fill="#9BB8CC">(value, maximum) {</text><text x="580" y="150" fill="#00D9FF">return</text><text x="675" y="150" fill="#F2FAFF">value</text><text x="745" y="150" fill="#9BB8CC">/</text><text x="770" y="150" fill="#F2FAFF">maximum</text><text x="540" y="195" fill="#9BB8CC">}</text><text x="540" y="285" fill="#397BFF">let</text><text x="590" y="285" fill="#F2FAFF">observation</text><text x="750" y="285" fill="#9BB8CC">=</text><text x="780" y="285" fill="#60E6FF">factorial</text><text x="900" y="285" fill="#9BB8CC">(5)</text><text x="540" y="330" fill="#397BFF">let</text><text x="590" y="330" fill="#F2FAFF">normalized</text><text x="735" y="330" fill="#9BB8CC">=</text><text x="765" y="330" fill="#60E6FF">normalize</text><text x="895" y="330" fill="#9BB8CC">(observation, 200)</text></g></svg>