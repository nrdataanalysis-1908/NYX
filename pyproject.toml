[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-lang"
dynamic = ["version"]
description = "NYX — Numerical Yield eXchange: linguagem de programação científica orientada a dados."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NR TECH" }]
keywords = ["programming-language", "interpreter", "data-science", "scientific-computing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nyx = "nyx.cli:main"

[project.urls]
Homepage = "https://www.nrtechlab.dev/"

[tool.setuptools.dynamic]
version = { attr = "nyx._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
