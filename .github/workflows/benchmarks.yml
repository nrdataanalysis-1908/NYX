name: NYX reproducible benchmarks

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/run_benchmarks.py"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      repetitions:
        description: "Number of measured repetitions per workload/runtime"
        required: true
        default: "25"
        type: string

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NYX and benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" matplotlib numpy
      - name: Execute benchmark suite
        run: |
          python benchmarks/run_benchmarks.py --warmups 3 --repetitions "${{ inputs.repetitions || '25' }}"
      - name: Publish measured CSV, metadata and charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/results/latest.csv benchmarks/results/latest.json assets/benchmarks/*.svg
          if git diff --cached --quiet; then
            echo "No benchmark output changes."
          else
            git commit -m "docs: publish measured NYX benchmark results"
            git push
          fi
